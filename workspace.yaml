workspace:
  name: acornops
  description: Canonical multi-repository development workspace for AcornOps.

repositories:
  - name: acornops-deployment
    path: ./acornops-deployment
    remote: https://github.com/acornops/acornops-deployment.git
    default_branch: main
    validate: task validate

  - name: control-plane
    path: ./control-plane
    remote: https://github.com/acornops/control-plane.git
    default_branch: main
    validate: npm run validate

  - name: docs-website
    path: ./docs-website
    remote: https://github.com/acornops/docs-website.git
    default_branch: main
    validate: npm run validate

  - name: execution-engine
    path: ./execution-engine
    remote: https://github.com/acornops/execution-engine.git
    default_branch: main
    validate: task validate

  - name: agentk
    path: ./agentk
    remote: https://github.com/acornops/agentk.git
    default_branch: main
    validate: npm run validate

  - name: agentv
    path: ./agentv
    remote: https://github.com/acornops/agentv.git
    default_branch: main
    validate: npm run validate

  - name: llm-gateway
    path: ./llm-gateway
    remote: https://github.com/acornops/llm-gateway.git
    default_branch: main
    validate: task validate

  - name: management-console
    path: ./management-console
    remote: https://github.com/acornops/management-console.git
    default_branch: main
    validate: npm run validate

  - name: charts
    path: ./charts
    remote: https://github.com/acornops/charts.git
    default_branch: main
